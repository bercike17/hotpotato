name: Build Plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          POM_PATH=$(find . -name "pom.xml" | head -n 1)
          if [ -z "$POM_PATH" ]; then
            echo "::error::Nem található pom.xml a projektben!"
            exit 1
          fi
          echo "Found pom at: $POM_PATH"
          mvn clean package --batch-mode -f "$POM_PATH"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Plugin-Build
          path: |
            **/target/*.jar
            !**/target/original-*.jar
            !**/target/*-sources.jar
